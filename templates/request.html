<!DOCTYPE html>
<html>
<head>
  <title>Request a Song</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

  <style>
    body {
      background: #111;
      color: white;
      padding: 2rem;
      font-size: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    input.form-control {
      height: 4rem;
      font-size: 1.5rem;
      padding: 1rem;
    }

    button.btn {
      font-size: 1.5rem;
      padding: 1rem;
      height: 4rem;
    }

    .result {
      padding: 1.5rem;
      border-bottom: 1px solid #444;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      cursor: pointer;
    }

    .result:hover {
      background: #222;
    }

    .thumb {
      width: 160px;
      height: auto;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .result div {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>
    <h1>🎵 Request a Song</h1>

    <div class="row g-3 mb-5">
      <div class="col-12">
        <input id="searchBox" type="text" class="form-control" placeholder="Search for a song...">
      </div>
      <div class="col-12 d-grid">
        <button id="searchButton" class="btn btn-primary">🔍 Search</button>
      </div>

    <div id="results"></div>

  <script>
    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    document.getElementById("searchButton").addEventListener("click", async () => {
      const query = document.getElementById("searchBox").value;
      const result = await fetch(`/search?q=${encodeURIComponent(query)}`);
      const data = await result.json();

      const resultsElement = document.getElementById("results");
      resultsElement.innerHTML = "";

      data.results.forEach(video => {
        const div = document.createElement("div");
        div.className = "result";
        div.innerHTML = `
          <img class="thumb" src="https://img.youtube.com/vi/${video.id}/default.jpg">
          <div>
            <strong>${video.title}</strong><br>
            <small>${formatDuration(video.duration || 0)}</small>
          </div>
        `;
        div.onclick = async() => {
          alert("Added to the queue");
          await fetch("/add_song", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: `https://www.youtube.com/watch?v=${video.id}` })
          });
        };
        resultsElement.appendChild(div);
      });
    })
  </script>

</body>
</html>
